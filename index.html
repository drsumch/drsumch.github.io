<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<title>Layout 1</title>
<style>
*{
margin: 0px;
padding: 0px;
box-sizing: border-box;
}
#logo-div{width:100%, min-height: 50px; background-color: lightgray; padding-left: 2%; line-height: 50px; margin-bottom: 10px;}
#nav-div{width:100%; min-height: 30px; background-color: lightgray; text-align: center; line-height: 30px; margin-bottom: 10px;}
#header-banner-div{width:100%; min-height: 100px; background-color: lightgray; text-align: center; line-height: 100px; margin-bottom: 10px;}
#main-div{width: 100%; min-height: 400px; background-color: gray;}
#sidebar-div{width: 25%; min-height: 400px; background-color: lightgray;}
#bodyarea-div{width:75%; min-height: 400px; background-color: lightgray;}
</style> 
</head>
<body>
<div id="logo-div">Logo</div>
<div id="nav-div">Navigation</div>
<div id="header-banner-div">Header / Banner</div>
<div id="main-div">
<div id="sidebar-div">Sidebar</div><div id="bodyarea-div">Bodyarea</div>
</div>
</body>
</html>
